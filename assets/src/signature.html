<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Email signature images</title>
<!-- Source for the PNGs in assets/signature/. Each element with data-out is saved to that file by render_signature.py.
     Everything sits on a white plate with an ink border, so it reads the same in light and dark mail clients. -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<style>
	:root { --lime: #d6ff36; --ink: #080808; --paper: #f7f8f4; }
	* { box-sizing: border-box; margin: 0; padding: 0; }
	html, body { background: transparent; }
	body { font-family: "Inter", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; padding: 20px; display: flex; flex-direction: column; gap: 30px; align-items: flex-start; }
	.row { display: flex; gap: 20px; }

	/* avatar: 80 x 80 incl. ink ring, shown at 80px. No offset shadow, it looked heavy next to the text. */
	.avw { width: 80px; height: 80px; position: relative; }
	.avw img { position: absolute; left: 3px; top: 3px; width: 74px; height: 74px; border-radius: 50%; object-fit: cover; border: 4px solid var(--lime); box-shadow: 0 0 0 3px var(--ink); }

	/* social chips: 34 x 34 incl. shadow, shown at 34px */
	.chip { width: 34px; height: 34px; position: relative; }
	.chip i { position: absolute; left: 3px; top: 3px; width: 31px; height: 31px; border-radius: 50%; background: var(--ink); }
	.chip b { position: absolute; left: 0; top: 0; width: 31px; height: 31px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center; }
	.chip svg { width: 17px; height: 17px; display: block; }

	/* call to action pill */
	.ctaw { display: inline-block; padding: 0 4px 4px 0; }
	.cta { display: inline-flex; align-items: center; gap: 9px; height: 38px; padding: 0 16px 0 14px; border: 2.5px solid var(--ink); border-radius: 999px; background: var(--lime); box-shadow: 4px 4px 0 var(--ink); font: 800 14.5px "Plus Jakarta Sans"; letter-spacing: -.1px; white-space: nowrap; }
	.cta .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px rgba(8,8,8,.18); }
	.cta svg { width: 15px; height: 15px; display: block; }
</style>
</head><body>
